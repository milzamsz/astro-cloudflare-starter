# Dependency Review Configuration
# https://github.com/actions/dependency-review-action#configuration-options
#
# Note: `allow-licenses` and `deny-licenses` are mutually exclusive. An allow
# list implicitly denies everything else (GPL/AGPL/SSPL, …).

# Severity threshold for failing the build: low | moderate | high | critical
fail-on-severity: moderate

# Advisories accepted by the repo owner. Keep each one justified and remove it
# as soon as a patched version exists.
allow-ghsas:
  # picomatch ReDoS via repeated extglobs: affects every release up to 4.0.7 and
  # has no fix yet (main already shipped 4.0.5). Build-time only (Astro/Vite/
  # Stylelint/Vitest glob matching on patterns in this repo); not in dist/ and
  # never given untrusted input. Accepted 2026-11-17.
  - GHSA-fc5q-39xc-vjpf

# Permissive / attribution licenses found in the Astro + Tailwind toolchain.
allow-licenses:
  - MIT
  - MIT-0
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - 0BSD
  - ISC
  - CC0-1.0
  - CC-BY-4.0 # caniuse-lite
  - BlueOak-1.0.0
  - Python-2.0 # argparse
  - MPL-2.0 # lightningcss (file-level copyleft, fine for unmodified use)
  - Unicode-DFS-2016
  - Unicode-3.0

# Prebuilt libvips binaries used by sharp are LGPL-3.0-or-later (dynamically
# linked, unmodified) — allowed explicitly instead of allowing LGPL globally.
allow-dependencies-licenses:
  - pkg:npm/%40img/sharp-libvips-linux-x64
  - pkg:npm/%40img/sharp-libvips-linuxmusl-x64
  - pkg:npm/%40img/sharp-libvips-linux-arm64
  - pkg:npm/%40img/sharp-libvips-linuxmusl-arm64
  - pkg:npm/%40img/sharp-libvips-darwin-arm64
  - pkg:npm/%40img/sharp-libvips-darwin-x64
  - pkg:npm/%40img/sharp-wasm32
